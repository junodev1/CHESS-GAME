name: Build Chess AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK with friendly name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Chess-AI.apk

      - name: Upload Chess AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-AI-Android
          path: Chess-AI.apk
          if-no-files-found: error
          retention-days: 30
