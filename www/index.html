<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18202a">
  <title>Chess AI</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/settings.css">
  <style>
    /* touch-friendly tweaks */
    .square { touch-action: manipulation; -webkit-tap-highlight-color: rgba(0,0,0,0.08); }
  </style>
</head>
<body>
  <main class="game-layout">
    <section class="board-container">
      <div class="game-header">
        <div>
          <h1>Chess AI</h1>
          <span id="gameStatus" aria-live="polite">White to move</span>
        </div>
        <button id="settingsButton" type="button" aria-label="Open settings">⚙️</button>
      </div>
      <div id="chessBoard" aria-label="Chess board"></div>
    </section>

    <aside class="history-panel">
      <div class="panel-title">
        <h2>Moves</h2>
        <span id="openingName">Opening: —</span>
      </div>
      <div id="moveHistory"></div>
      <div class="controls">
        <button id="newGameButton" type="button">New Game</button>
        <button id="hintButton" type="button">Hint</button>
        <button id="exportPGNButton" type="button">Export PGN</button>
        <button id="importPGNButton" type="button">Import PGN</button>
        <input id="importPGNInput" type="file" accept=".pgn,text/plain" hidden>
      </div>
      <section class="statistics" aria-label="Statistics">
        <div>Wins: <span data-wins>0</span></div>
        <div>Losses: <span data-losses>0</span></div>
        <div>Draws: <span data-draws>0</span></div>
        <div>Fastest Win: <span data-fastest-win>—</span></div>
      </section>
    </aside>
  </main>

  <aside id="settingsPanel" class="settings-panel" aria-label="Settings">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="closeSettingsButton" type="button" aria-label="Close settings">✕</button>
    </div>
    <!-- settings content omitted for brevity -->
  </aside>

  <div id="analysisModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="analysisTitle">
    <div class="modal-card">
      <h2 id="analysisTitle">Game Analysis</h2>
      <p>Opening: <strong data-analysis-opening>—</strong></p>
      <!-- modal content omitted -->
    </div>
  </div>

  <!-- scripts: utils.js must load before state.js to provide polyfills -->
  <script src="js/security.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/moves.js"></script>
  <script src="js/openings.js"></script>
  <script src="js/board.js"></script>
  <script src="js/pgn.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/hints.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/statistics.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
