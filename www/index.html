<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18202a"><title>Juno Chess</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/board.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/settings.css"></head>
<body><main class="game-layout"><section class="board-container"><div class="game-header"><div><h1>Juno Chess</h1><span id="gameStatus" aria-live="polite">White to move</span></div><button id="settingsButton" type="button" aria-label="Open settings">⚙️</button></div><div id="chessBoard" aria-label="Chess board"></div></section><aside class="history-panel"><div class="panel-title"><h2>Moves</h2><span id="openingName">Opening: —</span></div><div id="moveHistory"></div><div class="controls"><button id="newGameButton" type="button">New Game</button><button id="hintButton" type="button">Hint</button><button id="exportPGNButton" type="button">Export PGN</button><button id="importPGNButton" type="button">Import PGN</button><input id="importPGNInput" type="file" accept=".pgn,text/plain" hidden></div><section class="statistics" aria-label="Statistics"><div>Wins: <span data-wins>0</span></div><div>Losses: <span data-losses>0</span></div><div>Draws: <span data-draws>0</span></div><div>Fastest Win: <span data-fastest-win>—</span></div></section></aside></main>
<aside id="settingsPanel" class="settings-panel" aria-label="Settings"><div class="settings-header"><h2>Settings</h2><button id="closeSettingsButton" type="button" aria-label="Close settings">✕</button></div><div class="setting"><label for="themeSelect">Interface</label><select id="themeSelect"><option value="light">Light</option><option value="dark">Dark</option><option value="classic">Classic</option></select></div><div class="setting"><label for="boardThemeSelect">Board</label><select id="boardThemeSelect"><option value="green">Green</option><option value="blue">Blue</option><option value="brown">Brown</option><option value="gray">Gray</option></select></div><div class="setting"><label for="difficultySelect">AI Difficulty</label><select id="difficultySelect"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div><div class="setting"><label for="animationsToggle">Animations</label><input id="animationsToggle" type="checkbox"></div><div class="setting"><label for="soundToggle">Sounds</label><input id="soundToggle" type="checkbox"></div><div class="setting"><label for="hintToggle">Hints</label><input id="hintToggle" type="checkbox"></div><div class="setting"><label for="coordinatesToggle">Coordinates</label><input id="coordinatesToggle" type="checkbox"></div><div class="setting"><label for="autosaveToggle">Autosave</label><input id="autosaveToggle" type="checkbox"></div></aside>
<div id="analysisModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="analysisTitle"><div class="modal-card"><h2 id="analysisTitle">Game Analysis</h2><p>Opening: <strong data-analysis-opening></strong></p><p>Moves: <strong data-analysis-moves></strong></p><p>Captures: <strong data-analysis-captures></strong></p><p>Result: <strong data-analysis-result></strong></p><button id="closeAnalysisButton" type="button">Close</button></div></div><div id="achievementToast" role="status"></div>
<script src="js/security.js"></script><script src="js/state.js"></script><script src="js/storage.js"></script><script src="js/moves.js"></script><script src="js/openings.js"></script><script src="js/history.js"></script><script src="js/statistics.js"></script><script src="js/achievements.js"></script><script src="js/board.js"></script><script src="js/ai.js"></script><script src="js/hints.js"></script><script src="js/pgn.js"></script><script src="js/analysis.js"></script><script src="js/settings.js"></script><script src="js/game.js"></script><script src="js/app.js"></script></body></html>
