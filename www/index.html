<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover"
    >
    <title>Chess Game</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>

<main class="game-layout">

    <section class="board-container">
        <div id="chessBoard"></div>
    </section>

    <aside class="history-panel">
        <div id="moveHistory"></div>

        <div class="controls">
            <button id="newGameButton">New Game</button>
            <button id="hintButton">Hint</button>
            <button id="exportPGNButton">Export PGN</button>
            <button id="settingsButton">Settings</button>
        </div>

        <section class="statistics">
            <div>Wins: <span data-wins>0</span></div>
            <div>Losses: <span data-losses>0</span></div>
            <div>Draws: <span data-draws>0</span></div>
            <div>Fastest Win: <span data-fastest-win>—</span></div>
        </section>
    </aside>

</main>

<aside id="settingsPanel" class="settings-panel">

    <h2>Settings</h2>

    <div class="setting">
        <label for="themeSelect">Interface</label>
        <select id="themeSelect">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="classic">Classic</option>
        </select>
    </div>

    <div class="setting">
        <label for="boardThemeSelect">Board</label>
        <select id="boardThemeSelect">
            <option value="green">Green</option>
            <option value="blue">Blue</option>
            <option value="brown">Brown</option>
            <option value="gray">Gray</option>
        </select>
    </div>

    <div class="setting">
        <label for="animationsToggle">Animations</label>
        <input id="animationsToggle" type="checkbox">
    </div>

    <div class="setting">
        <label for="soundToggle">Sounds</label>
        <input id="soundToggle" type="checkbox">
    </div>

    <div class="setting">
        <label for="hintToggle">Hints</label>
        <input id="hintToggle" type="checkbox">
    </div>

    <div class="setting">
        <label for="coordinatesToggle">Coordinates</label>
        <input id="coordinatesToggle" type="checkbox">
    </div>

    <div class="setting">
        <label for="autosaveToggle">Autosave</label>
        <input id="autosaveToggle" type="checkbox">
    </div>

</aside>

<div id="analysisModal" class="settings-panel">

    <h2>Game Analysis</h2>

    <p>
        Opening:
        <strong data-analysis-opening></strong>
    </p>

    <p>
        Moves:
        <strong data-analysis-moves></strong>
    </p>

    <p>
        Captures:
        <strong data-analysis-captures></strong>
    </p>

    <p>
        Result:
        <strong data-analysis-result></strong>
    </p>

    <button id="closeAnalysisButton">
        Close
    </button>

</div>

<div id="achievementToast"></div>

<script type="module" src="js/app.js"></script>

</body>
</html>
